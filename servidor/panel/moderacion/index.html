<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderación de chat — Ciber Mensajería</title>
  <link rel="stylesheet" href="/moderacion/estilo.css">
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <span class="marca-icono" aria-hidden="true">🔍</span>
      <div>
        <h1>Moderación de chat</h1>
        <p class="subtitulo">Solo lectura — lab.lan</p>
      </div>
    </div>
    <div class="indicador-actualizacion" id="indicador-actualizacion">
      <span class="punto-vivo" aria-hidden="true"></span>
      <span id="texto-actualizacion">Conectando…</span>
    </div>
  </header>

  <main class="layout-moderacion">
    <section class="lista-conversaciones" aria-labelledby="titulo-conversaciones">
      <h2 id="titulo-conversaciones">Conversaciones</h2>
      <div class="contenedor-tabla">
        <table>
          <thead>
            <tr>
              <th scope="col">Equipos</th>
              <th scope="col">Mensajes</th>
              <th scope="col">Último</th>
            </tr>
          </thead>
          <tbody id="cuerpo-conversaciones">
            <tr>
              <td colspan="3" class="vacio">
                <span class="vacio-icono" aria-hidden="true">⏳</span>
                Cargando…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="detalle-mensajes" aria-labelledby="titulo-mensajes">
      <h2 id="titulo-mensajes">Mensajes</h2>
      <p id="etiqueta-conversacion" class="etiqueta-conversacion">Selecciona una conversación de la lista</p>
      <div id="lista-mensajes" class="lista-mensajes">
        <p class="vacio">
          <span class="vacio-icono" aria-hidden="true">💬</span>
          Sin mensajes seleccionados
        </p>
      </div>
    </section>
  </main>

  <script src="/moderacion/comun.js"></script>
  <script src="/moderacion/app.js"></script>
</body>
</html>
