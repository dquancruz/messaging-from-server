<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciber Mensajería — Panel</title>
  <link rel="stylesheet" href="/panel/estilo.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-contenido">
      <div class="marca">
        <span class="marca-icono" aria-hidden="true">☕</span>
        <div>
          <h1>Ciber Mensajería</h1>
          <p class="subtitulo">Panel de control — lab.lan</p>
        </div>
      </div>

      <div class="cabecera-derecha">
        <div class="indicador-actualizacion" id="indicador-actualizacion" title="Última actualización">
          <span class="punto-vivo" aria-hidden="true"></span>
          <span id="texto-actualizacion">Conectando…</span>
        </div>

        <label class="interruptor-chat" title="Permite o bloquea el chat entre clientes">
          <span class="interruptor-etiqueta">Chat entre clientes</span>
          <span class="interruptor-pista">
            <input type="checkbox" id="chat-habilitado">
            <span class="interruptor-slider" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </div>

    <div class="resumen-estadisticas" id="resumen-estadisticas" aria-label="Resumen de equipos">
      <div class="tarjeta-stat">
        <span class="stat-valor" id="stat-conectados">—</span>
        <span class="stat-etiqueta">Conectados</span>
      </div>
      <div class="tarjeta-stat">
        <span class="stat-valor" id="stat-sesiones">—</span>
        <span class="stat-etiqueta">Con sesión</span>
      </div>
      <div class="tarjeta-stat stat-alerta">
        <span class="stat-valor" id="stat-bloqueados">—</span>
        <span class="stat-etiqueta">Bloqueados</span>
      </div>
      <div class="tarjeta-stat">
        <span class="stat-valor" id="stat-total">—</span>
        <span class="stat-etiqueta">Total equipos</span>
      </div>
    </div>
  </header>

  <main class="layout-principal">
    <aside class="panel-envio" aria-labelledby="titulo-mensaje">
      <h2 id="titulo-mensaje">Enviar aviso</h2>

      <div class="atajos" role="group" aria-label="Mensajes rápidos">
        <button type="button" class="atajo atajo-aviso" data-texto="Te quedan 5 minutos" data-nivel="aviso">
          <span class="atajo-icono" aria-hidden="true">⏱</span>
          5 minutos
        </button>
        <button type="button" class="atajo atajo-critico" data-texto="Te queda 1 minuto" data-nivel="critico">
          <span class="atajo-icono" aria-hidden="true">⚠</span>
          1 minuto
        </button>
        <button type="button" class="atajo atajo-critico" data-texto="Tu tiempo terminó, pasa a caja" data-nivel="critico">
          <span class="atajo-icono" aria-hidden="true">🛑</span>
          Tiempo terminó
        </button>
      </div>

      <form id="form-mensaje" class="formulario-envio">
        <div class="campo">
          <label for="texto">Mensaje</label>
          <textarea id="texto" name="texto" rows="4" required placeholder="Escribe el aviso para los equipos seleccionados…"></textarea>
        </div>

        <div class="campo">
          <label for="nivel">Nivel</label>
          <select id="nivel" name="nivel" class="select-nivel">
            <option value="info">ℹ️ Información</option>
            <option value="aviso">⚠️ Aviso</option>
            <option value="critico">🔴 Crítico</option>
          </select>
        </div>

        <label class="opcion-respaldo">
          <input type="checkbox" id="usar-respaldo">
          <span>Usar envío de respaldo (msg.exe / SSH) si no hay agente</span>
        </label>

        <div class="seleccion-info" id="seleccion-info">
          <span class="seleccion-contador" id="seleccion-contador">0 equipos seleccionados</span>
        </div>

        <button type="submit" class="btn-primario btn-enviar" id="btn-enviar">
          <span class="btn-icono" aria-hidden="true">📨</span>
          Enviar aviso
        </button>
      </form>
    </aside>

    <section class="panel-equipos" aria-labelledby="titulo-equipos">
      <div class="cabecera-tabla">
        <div class="cabecera-tabla-izq">
          <h2 id="titulo-equipos">Equipos</h2>
          <span class="badge-seleccion" id="badge-seleccion" hidden>0 sel.</span>
        </div>
        <div class="acciones-cabecera">
          <button type="button" id="btn-actualizar-equipos" class="btn-secundario" title="Actualizar ahora">
            <span class="btn-icono" aria-hidden="true">↻</span>
            Actualizar
          </button>
          <a href="/api/historial.csv" class="btn-secundario" download title="Descargar historial">
            <span class="btn-icono" aria-hidden="true">⬇</span>
            CSV
          </a>
          <label class="seleccionar-todos">
            <input type="checkbox" id="seleccionar-todos">
            <span>Todos</span>
          </label>
        </div>
      </div>

      <div class="contenedor-tabla">
        <table>
          <thead>
            <tr>
              <th scope="col" class="col-sel" title="Seleccionar">
                <span class="sr-only">Seleccionar</span>
              </th>
              <th scope="col" class="col-so">SO</th>
              <th scope="col">Equipo</th>
              <th scope="col">Usuario</th>
              <th scope="col">IP</th>
              <th scope="col">Tiempo</th>
              <th scope="col">Estado</th>
              <th scope="col">Visto</th>
              <th scope="col">Sesión</th>
            </tr>
          </thead>
          <tbody id="cuerpo-equipos">
            <tr>
              <td colspan="9" class="vacio">
                <span class="vacio-icono" aria-hidden="true">⏳</span>
                Cargando equipos…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="contenedor-toasts" class="contenedor-toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="/panel/comun.js"></script>
  <script src="/panel/app.js"></script>
</body>
</html>
