name: PR Validation

# Runs on every PR targeting main — validates before merge is allowed
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can analyze commits

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 3.10 es el minimo del proyecto (es el de Ubuntu 22.04, ver
          # CLAUDE.md) — se fija esta version, y no la mas reciente, para
          # que el CI detecte si se cuela sintaxis de 3.11+.
          python-version: '3.10'

      # ----------------------------------------------------------------
      # Tests
      # ----------------------------------------------------------------
      # Solo biblioteca estandar (sin requirements.txt/pip install), tal
      # como pide CLAUDE.md para servidor y agente. Mismo criterio que
      # .githooks/pre-commit: si todavia no hay pruebas (fases tempranas
      # del plan), no falla el check por eso.
      - name: Run tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s tests -v
          else
            echo "No hay pruebas todavia en tests/, se omite."
          fi

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    needs: validate  # only review if validation passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------
      # Security scan — look for hardcoded secrets in the diff
      # ----------------------------------------------------------------
      - name: Scan for secrets
        run: |
          echo "Scanning diff for potential secrets..."
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          DIFF=$(git diff "$BASE_SHA" "$HEAD_SHA")

          # Patterns that should never appear in committed code
          if echo "$DIFF" | grep -iE "(api[_-]?key|secret|password|token)\s*=\s*['\"][^'\"]{8,}" ; then
            echo "::error::Potential hardcoded secret detected in diff"
            exit 1
          fi

          if echo "$DIFF" | grep -E "ghp_[a-zA-Z0-9]{36}" ; then
            echo "::error::GitHub token detected in diff"
            exit 1
          fi

          echo "No secrets found in diff."

      # ----------------------------------------------------------------
      # Basic quality checks on changed files
      # ----------------------------------------------------------------
      - name: Check for leftover debug code
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DIFF=$(git diff "$BASE_SHA" "$HEAD_SHA")

          # Warn (don't block) on leftover Python debug code
          if echo "$DIFF" | grep -E "^\+.*\b(breakpoint\(\)|pdb\.set_trace)\b" ; then
            echo "::warning::Leftover debug code (breakpoint()/pdb.set_trace) found"
          fi
          echo "Quality check complete."
